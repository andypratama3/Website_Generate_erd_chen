    <script>
        // ======================================================
        // CONFIGURATION
        // ======================================================
        const CONFIG = {
            layout: {
                paddingX: 250,
                paddingY: 200,
                colWidth: 800,        // Diperbesar untuk menghindari overlap
                entityWidth: 180,
                entityHeight: 50,
                attrLeftX: -260,      // Lebih jauh ke kiri
                attrRightX: 260,      // Lebih jauh ke kanan
                attrHeight: 28,
                attrWidth: 140,
                attrSpacing: 42,      // Spacing antar attribute diperbesar
                relationshipWidth: 110,
                relationshipHeight: 65,
                relationshipOffsetY: -20,
            },
            dynamicHeight: {
                base: 50,
                attrSpacing: 42,
                bottomPadding: 250,   // Padding bawah diperbesar
                topPadding: 100,      // Padding atas diperbesar
                minLayerHeight: 500,  // Minimum height diperbesar
            },
            skipColumns: new Set([
                'created_at', 'updated_at', 'deleted_at', 
                'remember_token', 'email_verified_at'
            ]),
            maxTablesPerLayer: 3,     // Dikurangi dari 4 ke 3
        };

        // State
        let sqlContent = '';
        let erdXML = '';
        
        // DOM Elements
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const configSection = document.getElementById('configSection');
        const generateBtn = document.getElementById('generateBtn');
        const statusArea = document.getElementById('statusArea');
        const statusMessages = document.getElementById('statusMessages');
        const downloadBtn = document.getElementById('downloadBtn');
        
        // Upload Area Events
        uploadArea.addEventListener('click', () => fileInput.click());
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.name.endsWith('.sql')) {
                handleFile(file);
            } else {
                addStatus('❌ Please upload a .sql file', 'error');
            }
        });
        
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                handleFile(file);
            }
        });
        
        function handleFile(file) {
            const reader = new FileReader();
            
            reader.onload = (e) => {
                sqlContent = e.target.result;
                fileName.textContent = file.name;
                fileSize.textContent = (file.size / 1024).toFixed(1) + ' KB';
                fileInfo.classList.add('active');
                configSection.classList.add('active');
                statusArea.classList.remove('active');
                downloadBtn.classList.remove('active');
                statusMessages.innerHTML = '';
            };
            
            reader.readAsText(file);
        }
        
        // Generate ERD
        generateBtn.addEventListener('click', generateERD);
        
        function generateERD() {
            if (!sqlContent) {
                addStatus('❌ Please upload a SQL file first', 'error');
                return;
            }
            
            generateBtn.disabled = true;
            statusArea.classList.add('active');
            statusMessages.innerHTML = '';
            downloadBtn.classList.remove('active');
            
            addStatus('🔍 Parsing SQL file...', 'processing');
            
            setTimeout(() => {
                try {
                    // Parse SQL
                    const { tables, foreignKeys, primaryKeys } = parseSQL(sqlContent);
                    addStatus(`✅ Found ${Object.keys(tables).length} tables`, 'success');
                    
                    // Detect junction tables
                    const junctionTables = detectJunctionTables(tables, foreignKeys);
                    if (junctionTables.size > 0) {
                        addStatus(`🔗 Detected ${junctionTables.size} junction tables (M:N)`, 'success');
                    }
                    
                    // Generate ERD with improved algorithm
                    addStatus('🎨 Generating ERD with improved layout...', 'processing');
                    erdXML = generateERDXML(tables, foreignKeys, primaryKeys, junctionTables);
                    
                    addStatus('✅ ERD generated successfully!', 'success');
                    generateBtn.disabled = false;
                    downloadBtn.classList.add('active');
                    
                } catch (error) {
                    addStatus(`❌ Error: ${error.message}`, 'error');
                    generateBtn.disabled = false;
                    console.error(error);
                }
            }, 500);
        }
        
        // Download ERD
        downloadBtn.addEventListener('click', () => {
            const outputName = document.getElementById('outputName').value || 'erd-chen-improved';
            const filename = outputName.endsWith('.drawio') ? outputName : outputName + '.drawio';
            
            const blob = new Blob([erdXML], { type: 'application/xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
            
            addStatus(`💾 Downloaded: ${filename}`, 'success');
        });
        
        function addStatus(message, type) {
            const div = document.createElement('div');
            div.className = `status-item status-${type}`;
            div.innerHTML = `<span class="status-icon">${getIcon(type)}</span><span>${message}</span>`;
            statusMessages.appendChild(div);
            statusArea.scrollTop = statusArea.scrollHeight;
        }
        
        function getIcon(type) {
            return type === 'success' ? '✓' : type === 'error' ? '✗' : '⟳';
        }
        
        // ======================================================
        // SQL PARSER
        // ======================================================
        function parseSQL(sql) {
            const tables = {};
            const foreignKeys = {};
            const primaryKeys = {};
            
            const tableRegex = /CREATE TABLE `(\w+)`\s*\((.*?)\)\s*ENGINE/gis;
            let match;
            
            while ((match = tableRegex.exec(sql)) !== null) {
                const tableName = match[1];
                const tableBody = match[2];
                
                const cols = [];
                const fks = [];
                let pk = null;
                
                const lines = tableBody.split('\n');
                
                for (const line of lines) {
                    const trimmed = line.trim();
                    
                    if (trimmed.startsWith('`')) {
                        const colMatch = trimmed.match(/`(\w+)`/);
                        if (colMatch) cols.push(colMatch[1]);
                    }
                    
                    if (trimmed.startsWith('PRIMARY KEY')) {
                        const pkMatch = trimmed.match(/`(\w+)`/);
                        if (pkMatch) pk = pkMatch[1];
                    }
                    
                    if (trimmed.includes('FOREIGN KEY')) {
                        const fkMatch = trimmed.match(/FOREIGN KEY \(`(\w+)`\) REFERENCES `(\w+)`/);
                        if (fkMatch) fks.push([fkMatch[1], fkMatch[2]]);
                    }
                }
                
                tables[tableName] = cols;
                foreignKeys[tableName] = fks;
                primaryKeys[tableName] = pk;
            }
            
            return { tables, foreignKeys, primaryKeys };
        }
        
        // ======================================================
        // DETECT JUNCTION TABLES
        // ======================================================
        function detectJunctionTables(tables, foreignKeys) {
            const junctionTables = new Set();
            
            for (const [table, fks] of Object.entries(foreignKeys)) {
                if (fks.length >= 2) {
                    const fkCols = new Set(fks.map(fk => fk[0]));
                    const nonFkCols = tables[table].filter(col => 
                        !fkCols.has(col) && !CONFIG.skipColumns.has(col)
                    );
                    
                    if (nonFkCols.length <= 1) {
                        junctionTables.add(table);
                    }
                }
            }
            
            return junctionTables;
        }
        
        // ======================================================
        // IMPROVED LAYERING ALGORITHM
        // ======================================================
        function calculateLayersImproved(tables, foreignKeys, junctionTables) {
            const inDegree = {};
            const graph = {};
            const reverseGraph = {};
            
            // Initialize
            for (const table of Object.keys(tables)) {
                inDegree[table] = 0;
                graph[table] = [];
                reverseGraph[table] = [];
            }
            
            // Build graph
            for (const [table, fks] of Object.entries(foreignKeys)) {
                for (const [fkCol, refTable] of fks) {
                    if (graph[refTable]) {
                        graph[refTable].push(table);
                        reverseGraph[table].push(refTable);
                        inDegree[table]++;
                    }
                }
            }
            
            // Topological sort
            const levelMap = {};
            const queue = [];
            
            for (const table of Object.keys(tables)) {
                if (inDegree[table] === 0) {
                    levelMap[table] = 0;
                    queue.push(table);
                }
            }
            
            while (queue.length > 0) {
                const table = queue.shift();
                const currentLevel = levelMap[table];
                
                for (const dependent of graph[table]) {
                    if (!(dependent in levelMap)) {
                        const parentLevels = reverseGraph[dependent]
                            .filter(p => p in levelMap)
                            .map(p => levelMap[p]);
                        const newLevel = parentLevels.length > 0 ? Math.max(...parentLevels) + 1 : currentLevel + 1;
                        levelMap[dependent] = newLevel;
                        
                        inDegree[dependent]--;
                        if (inDegree[dependent] === 0) {
                            queue.push(dependent);
                        }
                    }
                }
            }
            
            // Handle remaining tables
            for (const table of Object.keys(tables)) {
                if (!(table in levelMap)) {
                    if (foreignKeys[table] && foreignKeys[table].length > 0) {
                        const refLevels = foreignKeys[table]
                            .map(([_, ref]) => levelMap[ref])
                            .filter(l => l !== undefined);
                        levelMap[table] = refLevels.length > 0 ? Math.max(...refLevels) + 1 : 0;
                    } else {
                        levelMap[table] = 0;
                    }
                }
            }
            
            // Group into layers
            const layers = {};
            for (const [table, level] of Object.entries(levelMap)) {
                if (!layers[level]) layers[level] = [];
                layers[level].push(table);
            }
            
            // Balance layers
            const balancedLayers = {};
            let layerIdx = 0;
            
            for (const level of Object.keys(layers).sort((a, b) => a - b)) {
                let currentBatch = layers[level].filter(t => !junctionTables.has(t));
                
                while (currentBatch.length > CONFIG.maxTablesPerLayer) {
                    balancedLayers[layerIdx] = currentBatch.slice(0, CONFIG.maxTablesPerLayer);
                    currentBatch = currentBatch.slice(CONFIG.maxTablesPerLayer);
                    layerIdx++;
                }
                
                if (currentBatch.length > 0) {
                    balancedLayers[layerIdx] = currentBatch;
                    layerIdx++;
                }
            }
            
            // Rebuild level map
            const newLevelMap = {};
            for (const [level, tablesInLevel] of Object.entries(balancedLayers)) {
                for (const table of tablesInLevel) {
                    newLevelMap[table] = parseInt(level);
                }
            }
            
            return { layers: balancedLayers, levelMap: newLevelMap };
        }
        
        // ======================================================
        // COUNT ATTRIBUTES
        // ======================================================
        function countAttributes(table, tables, foreignKeys) {
            const fkCols = new Set(foreignKeys[table]?.map(fk => fk[0]) || []);
            let count = 0;
            
            for (const col of tables[table]) {
                if (col.endsWith('_id') && fkCols.has(col)) continue;
                if (CONFIG.skipColumns.has(col)) continue;
                count++;
            }
            
            return count;
        }
        
        // ======================================================
        // CALCULATE POSITIONS WITH COLLISION DETECTION
        // ======================================================
        function calculatePositions(tables, foreignKeys, junctionTables, layers, levelMap) {
            const positions = {};
            const occupiedSpaces = []; // Track occupied areas for collision detection
            
            for (const level of Object.keys(layers).sort((a, b) => a - b)) {
                const levelTables = layers[level].filter(t => !junctionTables.has(t)).sort();
                
                if (levelTables.length === 0) continue;
                
                // Calculate attributes for each table in this layer
                const tableAttrs = levelTables.map(t => ({
                    table: t,
                    count: countAttributes(t, tables, foreignKeys)
                }));
                
                // Calculate dynamic height based on max attributes
                const maxAttr = Math.max(...tableAttrs.map(t => t.count));
                const dynamicLayerHeight = Math.max(
                    CONFIG.dynamicHeight.base +
                    CONFIG.dynamicHeight.topPadding +
                    (maxAttr * CONFIG.dynamicHeight.attrSpacing) +
                    CONFIG.dynamicHeight.bottomPadding,
                    CONFIG.dynamicHeight.minLayerHeight
                );
                
                // Calculate column width based on max attributes in layer
                const dynamicColWidth = Math.max(
                    CONFIG.layout.colWidth,
                    CONFIG.layout.entityWidth + Math.abs(CONFIG.layout.attrLeftX) + Math.abs(CONFIG.layout.attrRightX) + 100
                );
                
                // Center entities if few tables
                const numTables = levelTables.length;
                let startX = CONFIG.layout.paddingX;
                
                if (numTables <= 2) {
                    startX = CONFIG.layout.paddingX + dynamicColWidth;
                } else if (numTables === 3) {
                    startX = CONFIG.layout.paddingX + dynamicColWidth / 2;
                }
                
                for (let idx = 0; idx < levelTables.length; idx++) {
                    const table = levelTables[idx];
                    const attrCount = tableAttrs[idx].count;
                    
                    // Calculate entity bounds with attributes
                    let x = startX + idx * dynamicColWidth;
                    let y = CONFIG.layout.paddingY + parseInt(level) * dynamicLayerHeight;
                    
                    // Check for collisions and adjust position
                    const entityBounds = calculateEntityBounds(x, y, attrCount);
                    let collision = checkCollision(entityBounds, occupiedSpaces);
                    let attempts = 0;
                    
                    while (collision && attempts < 10) {
                        // Try moving right
                        x += 100;
                        entityBounds.x = x;
                        entityBounds.left = x + CONFIG.layout.attrLeftX;
                        entityBounds.right = x + CONFIG.layout.entityWidth + CONFIG.layout.attrRightX + CONFIG.layout.attrWidth;
                        collision = checkCollision(entityBounds, occupiedSpaces);
                        attempts++;
                    }
                    
                    positions[table] = [x, y];
                    
                    // Mark this space as occupied
                    occupiedSpaces.push(entityBounds);
                }
            }
            
            return positions;
        }
        
        // Calculate bounds of entity including attributes
        function calculateEntityBounds(x, y, attrCount) {
            const attrsLeft = Math.ceil(attrCount / 2);
            const attrsRight = Math.floor(attrCount / 2);
            
            const heightLeft = attrsLeft * CONFIG.layout.attrSpacing;
            const heightRight = attrsRight * CONFIG.layout.attrSpacing;
            const maxHeight = Math.max(heightLeft, heightRight);
            
            return {
                x: x,
                y: y,
                left: x + CONFIG.layout.attrLeftX,
                right: x + CONFIG.layout.entityWidth + CONFIG.layout.attrRightX + CONFIG.layout.attrWidth,
                top: y,
                bottom: y + CONFIG.layout.entityHeight + maxHeight + 50
            };
        }
        
        // Check if entity bounds collide with any occupied space
        function checkCollision(bounds, occupiedSpaces) {
            for (const occupied of occupiedSpaces) {
                // Check for overlap
                const horizontalOverlap = bounds.left < occupied.right && bounds.right > occupied.left;
                const verticalOverlap = bounds.top < occupied.bottom && bounds.bottom > occupied.top;
                
                if (horizontalOverlap && verticalOverlap) {
                    return true;
                }
            }
            return false;
        }
        
        // ======================================================
        // GENERATE ERD XML
        // ======================================================
        function generateERDXML(tables, foreignKeys, primaryKeys, junctionTables) {
            const diagramName = document.getElementById('diagramName').value || 'ERD Chen FINAL';
            
            // Calculate improved layout
            const { layers, levelMap } = calculateLayersImproved(tables, foreignKeys, junctionTables);
            const positions = calculatePositions(tables, foreignKeys, junctionTables, layers, levelMap);
            
            // Calculate canvas size based on content
            let maxX = 0, maxY = 0;
            for (const [table, [x, y]] of Object.entries(positions)) {
                const attrCount = countAttributes(table, tables, foreignKeys);
                const bounds = calculateEntityBounds(x, y, attrCount);
                maxX = Math.max(maxX, bounds.right);
                maxY = Math.max(maxY, bounds.bottom);
            }
            
            // Add padding to canvas
            const canvasWidth = Math.max(2000, maxX + 300);
            const canvasHeight = Math.max(1500, maxY + 300);
            
            let xml = `<?xml version="1.0" encoding="UTF-8"?>
<mxfile host="app.diagrams.net">
  <diagram name="${escapeXML(diagramName)}">
    <mxGraphModel dx="${canvasWidth}" dy="${canvasHeight}">
      <root>
        <mxCell id="0"/>
        <mxCell id="1" parent="0"/>
`;
            
            const entityIds = {};
            let cellId = 2;
            
            // Create entities with alternating attributes
            for (const [table, cols] of Object.entries(tables)) {
                if (junctionTables.has(table) || !positions[table]) continue;
                
                const [x, y] = positions[table];
                const eid = `entity-${cellId++}`;
                entityIds[table] = eid;
                
                // Entity box
                xml += `        <mxCell id="${eid}" value="${escapeXML(table)}" style="shape=rectangle;whiteSpace=wrap;html=1;strokeColor=#000000;fillColor=#ffffff;strokeWidth=2;fontSize=12;fontStyle=1;align=center;verticalAlign=middle;rounded=0;" vertex="1" parent="1">
          <mxGeometry x="${x}" y="${y}" width="${CONFIG.layout.entityWidth}" height="${CONFIG.layout.entityHeight}" as="geometry"/>
        </mxCell>
`;
                
                // Attributes with alternating placement
                const fkCols = new Set(foreignKeys[table]?.map(fk => fk[0]) || []);
                
                const displayCols = cols.filter(col => 
                    !(col.endsWith('_id') && fkCols.has(col)) && 
                    !CONFIG.skipColumns.has(col)
                ).sort();
                
                let attrYLeft = y + CONFIG.layout.entityHeight + 15;
                let attrYRight = y + CONFIG.layout.entityHeight + 15;
                
                for (let idx = 0; idx < displayCols.length; idx++) {
                    const col = displayCols[idx];
                    const isPK = col === primaryKeys[table];
                    
                    // Alternating placement
                    let attrX, attrY;
                    if (idx % 2 === 0) {
                        attrX = x + CONFIG.layout.attrLeftX;
                        attrY = attrYLeft;
                        attrYLeft += CONFIG.layout.attrSpacing;
                    } else {
                        attrX = x + CONFIG.layout.entityWidth + CONFIG.layout.attrRightX;
                        attrY = attrYRight;
                        attrYRight += CONFIG.layout.attrSpacing;
                    }
                    
                    const aid = `attr-${cellId++}`;
                    const strokeWidth = isPK ? '2' : '1';
                    const fontStyle = isPK ? '5' : '0';  // 5 = bold + underline
                    
                    xml += `        <mxCell id="${aid}" value="${escapeXML(col)}" style="ellipse;whiteSpace=wrap;html=1;strokeColor=#000000;fillColor=#ffffff;strokeWidth=${strokeWidth};fontSize=9;fontStyle=${fontStyle};align=center;verticalAlign=middle;" vertex="1" parent="1">
          <mxGeometry x="${attrX}" y="${attrY}" width="${CONFIG.layout.attrWidth}" height="${CONFIG.layout.attrHeight}" as="geometry"/>
        </mxCell>
        <mxCell id="${cellId++}" edge="1" source="${aid}" target="${eid}" style="strokeColor=#000000;strokeWidth=1.5;endArrow=none;endFill=0;curved=0;" parent="1">
          <mxGeometry relative="1" as="geometry"/>
        </mxCell>
`;
                }
            }
            
            // Create 1:N relationships with arrows
            for (const [table, fks] of Object.entries(foreignKeys)) {
                if (junctionTables.has(table) || !positions[table]) continue;
                
                for (const [fkCol, targetTable] of fks) {
                    if (!positions[targetTable] || !entityIds[targetTable] || !entityIds[table]) continue;
                    
                    const [ex, ey] = positions[table];
                    const [px, py] = positions[targetTable];
                    
                    const exCenter = ex + CONFIG.layout.entityWidth / 2;
                    const eyCenter = ey + CONFIG.layout.entityHeight / 2;
                    const pxCenter = px + CONFIG.layout.entityWidth / 2;
                    const pyCenter = py + CONFIG.layout.entityHeight / 2;
                    
                    const midX = Math.floor((exCenter + pxCenter) / 2);
                    const midY = Math.floor((eyCenter + pyCenter) / 2);
                    
                    const rx = midX - CONFIG.layout.relationshipWidth / 2;
                    const ry = midY - CONFIG.layout.relationshipHeight / 2 + CONFIG.layout.relationshipOffsetY;
                    
                    const rid = `rel-${cellId++}`;
                    
                    xml += `        <mxCell id="${rid}" value="memiliki" style="rhombus;whiteSpace=wrap;html=1;strokeColor=#000000;fillColor=#ffffff;strokeWidth=1.5;fontSize=10;align=center;verticalAlign=middle;" vertex="1" parent="1">
          <mxGeometry x="${rx}" y="${ry}" width="${CONFIG.layout.relationshipWidth}" height="${CONFIG.layout.relationshipHeight}" as="geometry"/>
        </mxCell>
        <mxCell id="${cellId++}" edge="1" source="${entityIds[table]}" target="${rid}" style="strokeColor=#000000;strokeWidth=1.5;endArrow=classic;endFill=1;curved=0;" parent="1">
          <mxGeometry relative="1" as="geometry"/>
        </mxCell>
        <mxCell id="${cellId++}" edge="1" source="${entityIds[targetTable]}" target="${rid}" style="strokeColor=#000000;strokeWidth=1.5;endArrow=none;endFill=0;curved=0;" parent="1">
          <mxGeometry relative="1" as="geometry"/>
        </mxCell>
`;
                    
                    // Add cardinality labels
                    const mX = (exCenter + (rx + CONFIG.layout.relationshipWidth / 2)) / 2;
                    const mY = (eyCenter + (ry + CONFIG.layout.relationshipHeight / 2)) / 2 - 15;
                    xml += addCardinalityLabel('N', mX, mY, cellId++);
                    
                    const oneX = (pxCenter + (rx + CONFIG.layout.relationshipWidth / 2)) / 2;
                    const oneY = (pyCenter + (ry + CONFIG.layout.relationshipHeight / 2)) / 2 + 15;
                    xml += addCardinalityLabel('1', oneX, oneY, cellId++);
                }
            }
            
            // Create M:N relationships
            for (const [table, fks] of Object.entries(foreignKeys)) {
                if (!junctionTables.has(table) || fks.length < 2) continue;
                
                const refs = fks.map(fk => fk[1]).filter(ref => 
                    positions[ref] && entityIds[ref]
                );
                
                if (refs.length >= 2) {
                    const [a, b] = refs;
                    
                    const [ax, ay] = positions[a];
                    const [bx, by] = positions[b];
                    
                    const axCenter = ax + CONFIG.layout.entityWidth / 2;
                    const ayCenter = ay + CONFIG.layout.entityHeight / 2;
                    const bxCenter = bx + CONFIG.layout.entityWidth / 2;
                    const byCenter = by + CONFIG.layout.entityHeight / 2;
                    
                    const midX = (axCenter + bxCenter) / 2;
                    const midY = (ayCenter + byCenter) / 2;
                    
                    const rx = midX - CONFIG.layout.relationshipWidth / 2;
                    const ry = midY - CONFIG.layout.relationshipHeight / 2 + CONFIG.layout.relationshipOffsetY;
                    
                    const rid = `rel-${cellId++}`;
                    
                    xml += `        <mxCell id="${rid}" value="memiliki" style="rhombus;whiteSpace=wrap;html=1;strokeColor=#000000;fillColor=#ffffff;strokeWidth=1.5;fontSize=10;align=center;verticalAlign=middle;" vertex="1" parent="1">
          <mxGeometry x="${rx}" y="${ry}" width="${CONFIG.layout.relationshipWidth}" height="${CONFIG.layout.relationshipHeight}" as="geometry"/>
        </mxCell>
`;
                    
                    for (const ent of [a, b]) {
                        const [ex, ey] = positions[ent];
                        const exCenter = ex + CONFIG.layout.entityWidth / 2;
                        const eyCenter = ey + CONFIG.layout.entityHeight / 2;
                        
                        xml += `        <mxCell id="${cellId++}" edge="1" source="${entityIds[ent]}" target="${rid}" style="strokeColor=#000000;strokeWidth=1.5;endArrow=classic;endFill=1;curved=0;" parent="1">
          <mxGeometry relative="1" as="geometry"/>
        </mxCell>
`;
                        
                        const mX = (exCenter + (rx + CONFIG.layout.relationshipWidth / 2)) / 2;
                        const mY = (eyCenter + (ry + CONFIG.layout.relationshipHeight / 2)) / 2 - 15;
                        xml += addCardinalityLabel('M', mX, mY, cellId++);
                    }
                }
            }
            
            xml += `      </root>
    </mxGraphModel>
  </diagram>
</mxfile>`;
            
            return xml;
        }
        
        function addCardinalityLabel(text, x, y, id) {
            return `        <mxCell id="${id}" value="${text}" style="text;html=1;align=center;verticalAlign=middle;fontSize=12;fontStyle=1;fillColor=#ffffff;strokeColor=none;" vertex="1" parent="1">
          <mxGeometry x="${Math.floor(x - 10)}" y="${Math.floor(y - 10)}" width="20" height="20" as="geometry"/>
        </mxCell>
`;
        }
        
        function escapeXML(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&apos;');
        }
    </script>
